name: Jalankan Python Jam 00.00 UTC

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install library Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Browser Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Siapkan credentials.json
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_CREDENTIALS" > credentials.json

      - name: Jalankan Script Scraping
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET: ${{ secrets.WA_TARGET }}
        run: python main.py
